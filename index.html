<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acordes de jazz · práctica de lectura</title>
<meta name="description" content="Generador aleatorio de acordes de jazz para practicar piano: lee el cifrado americano y tócalo rápido desde cualquier nota.">
<style>
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#14181F; --muted:#5A6472; --line:#D5DAE1;
  --accent:#3B3FA8; --accent-bg:#E6E7F8; --on-accent:#FFFFFF; --danger:#B3261E;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11141B; --card:#1A1F2A; --ink:#ECEFF5; --muted:#98A1B3; --line:#2B3242;
    --accent:#A9B0FF; --accent-bg:#262B4A; --on-accent:#11141B; --danger:#FF8A80;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
main{max-width:560px; margin:0 auto; padding:24px 16px 48px}
h1{font-size:18px; font-weight:600; margin:0 0 16px}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:24px 18px; text-align:center;
}
.label{font-size:12px; color:var(--muted); margin:0 0 4px}
#sym{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:clamp(44px,14vw,72px); font-weight:600; line-height:1.15;
  min-height:1.2em; overflow-wrap:anywhere;
}
.rule{border:0; border-top:1px solid var(--line); margin:16px 0}
#name{font-size:19px; font-weight:600; line-height:1.35; min-height:52px}
#formula{font-size:14px; color:var(--muted); margin:6px 0 0; min-height:21px}
#notes{font-size:17px; font-weight:600; color:var(--accent); min-height:26px}
#why{text-align:left; font-size:14px; line-height:1.5; color:var(--muted)}
#why.open{border-top:1px solid var(--line); margin-top:16px; padding-top:12px}
#why .h{font-size:12px; margin:0 0 4px}
#why p{margin:0 0 6px}

.actions{display:flex; gap:8px; margin:12px 0 28px}
button{
  font:inherit; cursor:pointer; min-height:48px; padding:0 16px; border-radius:10px;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.actions button{flex:1}
.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; font-size:17px}
.primary:hover{border-color:var(--accent); filter:brightness(1.08)}

h2{font-size:13px; font-weight:500; color:var(--muted); margin:0 0 8px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px}
.chip{min-height:36px; padding:0 12px; font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent-bg); color:var(--accent); border-color:var(--accent)}
.chip[aria-pressed="false"]{color:var(--muted)}
#err{font-size:13px; color:var(--danger); min-height:20px}
</style>
</head>
<body>
<main>
  <h1>Acordes de jazz</h1>

  <section class="card" aria-live="polite">
    <p class="label">Cifrado</p>
    <div id="sym"></div>
    <hr class="rule">
    <p class="label">En palabras (inglés)</p>
    <div id="name"></div>
    <div id="formula"></div>
    <hr class="rule">
    <p class="label">Notas</p>
    <div id="notes"></div>
    <div id="why"></div>
  </section>

  <div class="actions">
    <button id="rnd" class="primary" type="button">Random</button>
    <button id="tog" type="button">Ver respuesta</button>
  </div>

  <h2>Básicos</h2>
  <div id="c1" class="chips"></div>
  <h2>Extras</h2>
  <div id="c2" class="chips"></div>
  <div id="err" role="alert"></div>
</main>

<script>
var L=['C','D','E','F','G','A','B'], N=[0,2,4,5,7,9,11];
var R=[[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[3,1],[4,0],[5,-1],[5,0],[6,-1],[6,0]];
var T=[
{k:'maj7',s:'maj7',n:'major with a major seventh',f:'1 3 5 7',i:[[0,1],[4,3],[7,5],[11,7]],g:1,
 e:['maj7 (también se escribe M7 o Δ7): la séptima es mayor, un semitono por debajo de la octava.','Sin una m, la tercera es mayor y la quinta es justa.']},
{k:'7',s:'7',n:'dominant seventh (major with a minor seventh)',f:'1 3 5 ♭7',i:[[0,1],[4,3],[7,5],[10,7]],g:1,
 e:['Un 7 solo, sin maj ni M delante, significa séptima menor (♭7), un tono por debajo de la octava. Es la séptima que se toca por defecto.','Sin una m, la tercera es mayor. Este acorde se llama dominante.']},
{k:'m7',s:'m7',n:'minor with a minor seventh',f:'1 ♭3 5 ♭7',i:[[0,1],[3,3],[7,5],[10,7]],g:1,
 e:['m minúscula = minor: la tercera es menor (♭3).','Ojo: M mayúscula significa mayor (CM7 = Cmaj7), m minúscula significa menor.','El 7 sin maj ni M es la séptima menor (♭7).']},
{k:'mM7',s:'m(maj7)',n:'minor with a major seventh',f:'1 ♭3 5 7',i:[[0,1],[3,3],[7,5],[11,7]],g:1,
 e:['m = tercera menor (♭3).','maj7 = séptima mayor. Aquí la séptima no es la de por defecto: lo indica el maj.','Se escribe también mM7 o m△7: la m minúscula es la tercera, la M mayúscula es la séptima.']},
{k:'m7b5',s:'m7♭5',n:'minor with a minor seventh and flat fifth (half-diminished)',f:'1 ♭3 ♭5 ♭7',i:[[0,1],[3,3],[6,5],[10,7]],g:1,
 e:['m = tercera menor (♭3). El 7 sin maj es séptima menor (♭7).','♭5 = bajas la quinta un semitono (quinta disminuida).','También se escribe ø7 y se llama semidisminuido.']},
{k:'dim7',s:'°7',n:'diminished with a diminished seventh',f:'1 ♭3 ♭5 ♭♭7',i:[[0,1],[3,3],[6,5],[9,7]],g:1,
 e:['° o dim = disminuido: tercera menor (♭3) y quinta bemol (♭5).','En el °7 la séptima es disminuida (♭♭7): un semitono más baja que la menor. En el piano suena igual que una sexta mayor.']},
{k:'maj7s5',s:'maj7♯5',n:'major with a major seventh and sharp fifth',f:'1 3 ♯5 7',i:[[0,1],[4,3],[8,5],[11,7]],g:2,
 e:['maj7 = séptima mayor.','♯5 = subes la quinta un semitono (quinta aumentada).']},
{k:'7sus4',s:'7sus4',n:'dominant seventh with a fourth instead of a third',f:'1 4 5 ♭7',i:[[0,1],[5,4],[7,5],[10,7]],g:2,
 e:['sus4 = suspendido: se quita la tercera y se pone la cuarta en su lugar.','El 7 sin maj es la séptima menor (♭7).']},
{k:'6',s:'6',n:'major with a sixth',f:'1 3 5 6',i:[[0,1],[4,3],[7,5],[9,6]],g:2,
 e:['6 = sexta mayor añadida al acorde. No lleva séptima.','Sin una m, la tercera es mayor.']},
{k:'m6',s:'m6',n:'minor with a sixth',f:'1 ♭3 5 6',i:[[0,1],[3,3],[7,5],[9,6]],g:2,
 e:['m = tercera menor (♭3).','6 = sexta mayor añadida. No lleva séptima.']},
{k:'9',s:'9',n:'dominant ninth (minor seventh and ninth)',f:'1 3 5 ♭7 9',i:[[0,1],[4,3],[7,5],[10,7],[14,9]],g:2,
 e:['Un 9 solo implica también la séptima menor (♭7), aunque no se escriba.','La novena es la segunda nota de la escala, una octava más arriba.']},
{k:'maj9',s:'maj9',n:'major with a major seventh and ninth',f:'1 3 5 7 9',i:[[0,1],[4,3],[7,5],[11,7],[14,9]],g:2,
 e:['maj9 incluye la séptima mayor y además la novena.','La novena es la segunda nota de la escala, una octava más arriba.']},
{k:'m9',s:'m9',n:'minor with a minor seventh and ninth',f:'1 ♭3 5 ♭7 9',i:[[0,1],[3,3],[7,5],[10,7],[14,9]],g:2,
 e:['m = tercera menor (♭3).','El 9 implica la séptima menor (♭7) y añade la novena (la segunda, una octava arriba).']},
{k:'7b9',s:'7♭9',n:'dominant seventh with a flat ninth',f:'1 3 5 ♭7 ♭9',i:[[0,1],[4,3],[7,5],[10,7],[13,9]],g:2,
 e:['7 = séptima menor (♭7).','♭9 = la novena bajada un semitono: queda a un semitono sobre la fundamental, una octava arriba.']},
{k:'7s9',s:'7♯9',n:'dominant seventh with a sharp ninth',f:'1 3 5 ♭7 ♯9',i:[[0,1],[4,3],[7,5],[10,7],[15,9]],g:2,
 e:['7 = séptima menor (♭7).','♯9 = la novena subida un semitono: suena como una tercera menor una octava arriba, mezclada con la tercera mayor.']},
{k:'13',s:'13',n:'dominant thirteenth (minor seventh and thirteenth)',f:'1 3 5 ♭7 13',i:[[0,1],[4,3],[7,5],[10,7],[21,13]],g:2,
 e:['Un 13 solo implica la séptima menor (♭7) además de la treceava.','La treceava es la sexta, una octava más arriba. La novena y la oncena suelen omitirse.']},
{k:'7s5',s:'7♯5',n:'dominant seventh with a sharp fifth',f:'1 3 ♯5 ♭7',i:[[0,1],[4,3],[8,5],[10,7]],g:2,
 e:['7 = séptima menor (♭7).','♯5 = subes la quinta un semitono (quinta aumentada).']},
{k:'7b5',s:'7♭5',n:'dominant seventh with a flat fifth',f:'1 3 ♭5 ♭7',i:[[0,1],[4,3],[6,5],[10,7]],g:2,
 e:['7 = séptima menor (♭7).','♭5 = bajas la quinta un semitono (quinta disminuida).']}
];

var on={}; T.forEach(function(t){on[t.k]=true});
var AS={'-2':'♭♭','-1':'♭','0':'','1':'♯','2':'♯♯'};
var AN={'-2':' double flat','-1':' flat','0':'','1':' sharp','2':' double sharp'};
var last='', cur=null, shown=false;
var $=function(i){return document.getElementById(i)};

function spell(r,iv){
  var rpc=(N[r[0]]+r[1]+12)%12;
  return iv.map(function(p){
    var li=(r[0]+(p[1]-1))%7, tg=(rpc+p[0])%12, d=(tg-N[li]+12)%12;
    if(d>6)d-=12;
    return {l:li,a:d};
  });
}
function nm(x,words){return L[x.l]+(words?(AN[x.a]||''):(AS[x.a]||''))}

function clearWhy(){
  var w=$('why');
  w.textContent='';
  w.classList.remove('open');
}
function fillWhy(t){
  var w=$('why');
  w.textContent='';
  w.classList.add('open');
  var h=document.createElement('div');
  h.className='h'; h.textContent='Por qué';
  w.appendChild(h);
  t.e.forEach(function(line){
    var p=document.createElement('p');
    p.textContent=line;
    w.appendChild(p);
  });
}

function pick(){
  var act=T.filter(function(t){return on[t.k]});
  var c,tries=0,r,t;
  do{
    r=R[Math.floor(Math.random()*R.length)];
    t=act[Math.floor(Math.random()*act.length)];
    c=r.join(',')+t.k; tries++;
  }while(c===last && tries<20);
  last=c;
  var root={l:r[0],a:r[1]};
  cur={r:root,t:t,notes:spell(r,t.i)};
  $('sym').textContent=nm(root,false)+t.s;
  shown=false;
  $('name').textContent=''; $('formula').textContent=''; $('notes').textContent='';
  clearWhy();
  $('tog').textContent='Ver respuesta';
}
function toggle(){
  if(!cur)return;
  shown=!shown;
  $('tog').textContent=shown?'Ocultar respuesta':'Ver respuesta';
  $('name').textContent=shown?nm(cur.r,true)+' '+cur.t.n:'';
  $('formula').textContent=shown?'Fórmula: '+cur.t.f:'';
  $('notes').textContent=shown?cur.notes.map(function(x){return nm(x,false)}).join('  ·  '):'';
  if(shown)fillWhy(cur.t); else clearWhy();
}
function chip(t,box){
  var b=document.createElement('button');
  b.type='button'; b.className='chip'; b.textContent=t.s;
  function paint(){b.setAttribute('aria-pressed',on[t.k]?'true':'false')}
  b.onclick=function(){
    var n=T.filter(function(x){return on[x.k]}).length;
    if(on[t.k]&&n===1){$('err').textContent='Deja al menos un tipo de acorde activo.';return}
    $('err').textContent='';
    on[t.k]=!on[t.k]; paint();
  };
  paint(); box.appendChild(b);
}
T.forEach(function(t){chip(t,t.g===1?$('c1'):$('c2'))});
$('rnd').onclick=pick;
$('tog').onclick=toggle;
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();pick()}
});
pick();
</script>
</body>
</html>
