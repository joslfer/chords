<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jazz Chords · Reading Practice</title>
<meta name="description" content="Tool for studying Jazz chords.">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chords">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap');

:root{
  --bg:#0A0A0B; --ink:#F4F1EA; --soft:#E2DED4; --muted:#9A958A; --line:#4A4A4E; --danger:#FF8A80;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
html{overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
button{
  font:inherit; font-size:18px; cursor:pointer; min-height:48px; padding:0 16px; border-radius:10px;
  border:1px solid var(--line); background:transparent; color:var(--ink);
  touch-action:manipulation;
}
button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* Cero scroll, fijado a la pantalla */
.wrap{
  height:100vh; height:100dvh; overflow:hidden; 
  display:flex; flex-direction:column; cursor:pointer;
  padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));
}
#stage{
  flex:1; display:flex; flex-direction:column; align-items:center; 
  justify-content:flex-start; text-align:center;
  padding-top:calc(env(safe-area-inset-top,0px) + clamp(40px, 10vh, 120px));
  padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));
  width:100%;
}

#sym{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:clamp(48px,15vw,128px); font-weight:600; line-height:1.1;
  white-space:nowrap; letter-spacing:-0.02em;
}

#answer{display:none; flex-direction:column; align-items:center; width:100%}
#answer.on{display:flex;}

#name{
  font-family: "Merriweather", serif;
  font-size:clamp(18px,4vmin,34px); font-weight:400; font-style:italic; 
  line-height:1.2; margin:2vh 0 0; max-width:760px; color:var(--soft);
}

#meta{
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px 30px; 
  margin:1.5vh 0 0; font-size:clamp(16px,3.5vmin,28px); line-height:1.2;
  font-family: "Fira Code", monospace;
  letter-spacing: 0.03em;
}
#notes{font-weight:600; color:var(--ink)}
#formula{font-weight:400; color:var(--muted)}

#why{
  max-width:680px; text-align:left; 
  font-size:clamp(13px,2.2vh,20px); line-height:1.45; 
  color:var(--muted); margin:3vh 0 0;
  font-weight: 400; font-family: "Merriweather", serif;
}
#why p{margin:0 0 1.2vh}
#why p:last-child{margin-bottom:0}

#bar{
  position:fixed; left:0; right:0; top:env(safe-area-inset-top,0px); height:6px; z-index:10;
  background:rgba(255,255,255,.05); display:none; pointer-events:none;
}
body.auto #bar{display:block}
#fill{display:block; width:100%; height:100%; background:var(--ink); transform-origin:left center; transform:scaleX(1)}
#fill.b{background:var(--muted)}

button:disabled{opacity:.35; cursor:default}

#setBtn{
  position:fixed; z-index:11; top:max(16px,env(safe-area-inset-top)); right:max(16px,env(safe-area-inset-right));
  width:56px; height:56px; padding:0; border:none; background:transparent; color:var(--muted);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition: color 0.2s;
}
#setBtn:hover{color:var(--ink)}
#setBtn svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round}

#auto-zones{
  display:none; position:fixed; inset:0; z-index:5;
}
body.auto #auto-zones{display:flex}
.zone{
  flex:1; display:flex; align-items:flex-end; cursor:pointer;
  padding:max(32px,env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-left));
  -webkit-tap-highlight-color:transparent;
}
#left-zone{justify-content:flex-start}
#right-zone{justify-content:flex-end}

.zone svg{
  width:56px; height:56px; fill:currentColor; 
  opacity:0.25; transition:opacity 0.2s, transform 0.2s; color:var(--muted);
}
@media (hover: hover) {
  .zone:hover svg { opacity: 0.45; }
}
.zone:active svg{opacity:0.9; transform:scale(0.95)}

#counter {
  position: fixed; z-index: 10; pointer-events: none;
  bottom: max(24px, env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%);
  font-family: "Fira Code", monospace; 
  font-size: clamp(40px, 10vw, 84px);
  font-weight: 600;
  color: var(--line); 
  opacity: 0.35;
  letter-spacing: 0.02em;
}

#fw-canvas { position: fixed; inset: 0; z-index: 100; pointer-events: none; }

#sheet{position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center}
#backdrop{position:absolute; inset:0; background:rgba(0,0,0,.7)}
.panel{
  position:relative; width:100%; max-width:640px; max-height:88vh; max-height:88dvh; overflow:auto;
  -webkit-overflow-scrolling:touch; background:#161617; border:1px solid var(--line); border-radius:20px 20px 0 0;
  padding:16px 24px calc(24px + env(safe-area-inset-bottom,0px));
}
.row{display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:68px; font-size:20px; line-height:1.3}
.step{display:flex; align-items:center; gap:6px; flex:none}
.step button{width:52px; height:52px; padding:0; font-size:28px; line-height:1; border-radius:12px}
.step output{min-width:64px; text-align:center; font-size:22px; font-weight:600; font-variant-numeric: tabular-nums;}
.lbl{font-size:18px; font-weight:600; color:var(--soft); margin:24px 0 12px; text-transform:uppercase; letter-spacing:0.05em; font-family: -apple-system, sans-serif;}
.chips{display:flex; flex-wrap:wrap; gap:10px; margin:0 0 16px; font-family: -apple-system, sans-serif;}
.chip{color:var(--muted); border-radius:12px}
.chip[aria-pressed="true"]{border-color:var(--soft); color:var(--ink); background:rgba(255,255,255,0.05)}
#autoToggle{min-width:84px; text-align:center; font-family: -apple-system, sans-serif;}
#autoToggle[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
#err{font-size:16px; color:var(--danger); min-height:24px; font-family: -apple-system, sans-serif;}

.credit {
  text-align: center; font-size: 15px; color: var(--muted); 
  margin: 40px 0 20px; font-family: -apple-system, sans-serif;
}
.credit a {
  color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); 
  padding-bottom: 2px; transition: border-color 0.2s; font-weight: 500;
}
.credit a:hover { border-color: var(--ink); }
</style>
</head>
<body>

<div id="bar" aria-hidden="true"><i id="fill"></i></div>

<div id="counter">0</div>

<button id="setBtn" type="button" aria-haspopup="dialog" aria-label="Settings">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg>
</button>

<div id="auto-zones">
  <div id="left-zone" class="zone" aria-label="Play/Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
    <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5v14l11-7z"/></svg>
  </div>
  <div id="right-zone" class="zone" aria-label="Skip to next">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zm9-12v12h2V6h-2z"/></svg>
  </div>
</div>

<div class="wrap" id="wrap">
  <main id="stage" tabindex="0" aria-live="polite" aria-label="Tap anywhere to see the answer or skip to the next chord">
    <div id="sym"></div>
    <div id="answer">
      <div id="name"></div>
      <div id="meta"><span id="notes"></span><span id="formula"></span></div>
      <div id="why"></div>
    </div>
  </main>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Settings" hidden>
  <div id="backdrop"></div>
  <div class="panel">
    <div class="row" style="font-family: -apple-system, sans-serif;">
      <span>Auto mode</span>
      <button id="autoToggle" class="chip" type="button" aria-pressed="false">Off</button>
    </div>
    <div class="row" style="font-family: -apple-system, sans-serif;">
      <span>Show answer after</span>
      <div class="step">
        <button id="aMinus" type="button" aria-label="Decrease seconds to show answer">−</button>
        <output id="aVal">20 s</output>
        <button id="aPlus" type="button" aria-label="Increase seconds to show answer">+</button>
      </div>
    </div>
    <div class="row" style="font-family: -apple-system, sans-serif;">
      <span>Skip to next after</span>
      <div class="step">
        <button id="bMinus" type="button" aria-label="Decrease seconds to skip to next">−</button>
        <output id="bVal">5 s</output>
        <button id="bPlus" type="button" aria-label="Increase seconds to skip to next">+</button>
      </div>
    </div>
    <div class="lbl">Chord types</div>
    <div id="chips" class="chips"></div>
    <div id="err" role="alert"></div>
    
    <div class="credit">
      Visit my website <a href="https://joslfer.com" target="_blank" rel="noopener">joslfer.com</a>
    </div>
  </div>
</div>

<script>
var L=['C','D','E','F','G','A','B'], N=[0,2,4,5,7,9,11];
var R=[[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[3,1],[4,0],[5,-1],[5,0],[6,-1],[6,0]];

var T=[
{k:'maj7',s:'maj7',n:'Major 7th',f:'1 3 5 7',i:[[0,1],[4,3],[7,5],[11,7]],
 e:['The "maj7" (also written M7 or Δ) indicates a major seventh, a half-step below the root. Without an "m", the third is major and the fifth is perfect.',
    'It is a highly stable chord, typically used as the tonic (I) in major keys. In modern voicings, the natural 11th is usually avoided so it doesn\'t clash with the major third.']},
{k:'7',s:'7',n:'Dominant 7th',f:'1 3 5 ♭7',i:[[0,1],[4,3],[7,5],[10,7]],
 e:['A lone "7" always means minor seventh (♭7), a whole step below the root. Without an "m", the third is major. This is your default seventh chord.',
    'Known as the dominant chord (V), its built-in tritone creates a strong tension that naturally wants to resolve down a perfect fifth. In blues, however, it is stable enough to act as the tonic.']},
{k:'m7',s:'m7',n:'Minor 7th',f:'1 ♭3 5 ♭7',i:[[0,1],[3,3],[7,5],[10,7]],
 e:['The lowercase "m" means minor third (♭3). The "7" on its own means minor seventh (♭7).',
    'This is the standard ii chord in a ii-V-I progression. It is incredibly versatile, highly stable, and serves as the foundation for Dorian modal playing.']},
{k:'mM7',s:'m(maj7)',n:'Minor Major 7th',f:'1 ♭3 5 7',i:[[0,1],[3,3],[7,5],[11,7]],
 e:['The "m" dictates a minor third (♭3), while the "maj7" explicitly overrides the default seventh, making it major (a half-step below the root).',
    'Often used as a tonic minor chord (i). It has a distinct "spy movie" dissonance and frequently appears as a passing chord in minor line clichés (moving from m to mM7 to m7).']},
{k:'m7b5',s:'m7♭5',n:'Half-Diminished 7th',f:'1 ♭3 ♭5 ♭7',i:[[0,1],[3,3],[6,5],[10,7]],
 e:['The "m" means minor third (♭3), the "7" means minor seventh (♭7), and "♭5" lowers the fifth. Also written as ø7.',
    'It functions primarily as the ii chord in a minor ii-V-i progression. Unlike fully diminished chords, it lacks the diminished seventh, giving it a more open, floating quality.']},
{k:'dim7',s:'°7',n:'Fully Diminished 7th',f:'1 ♭3 ♭5 ♭♭7',i:[[0,1],[3,3],[6,5],[9,7]],
 e:['The "dim" or "°" means minor third (♭3) and flat fifth (♭5). In a diminished chord, the "7" specifically means a diminished seventh (♭♭7), which sounds identical to a major sixth.',
    'A completely symmetrical chord built entirely of stacked minor thirds. It is heavily used as a passing chord to connect diatonic chords smoothly via half-step motion.']},
{k:'maj7s5',s:'maj7♯5',n:'Major 7th Sharp 5',f:'1 3 ♯5 7',i:[[0,1],[4,3],[8,5],[11,7]],
 e:['"maj7" dictates a major seventh, while "♯5" means the fifth is raised a half-step (augmented).',
    'Commonly used as a substitute for a standard major tonic (derived from melodic minor harmony). It provides a more modern, unresolved, and floating color to a major ending.']},
{k:'7sus4',s:'7sus4',n:'Dominant 7th Suspended 4th',f:'1 4 5 ♭7',i:[[0,1],[5,4],[7,5],[10,7]],
 e:['"sus4" means the third is omitted and replaced by a perfect fourth. The "7" implies the standard minor seventh (♭7).',
    'Used historically to delay the resolution of a dominant chord. In modern post-bop jazz, it frequently acts as a standalone, floating chord that never actually resolves the fourth down to the third.']},
{k:'6',s:'6',n:'Major 6th',f:'1 3 5 6',i:[[0,1],[4,3],[7,5],[9,6]],
 e:['The "6" means a major sixth is added to the major triad. It does not contain a seventh.',
    'Highly stable and consonant. Before the maj7 took over in bebop, the 6 chord was the standard, traditional major tonic chord in swing and early jazz.']},
{k:'m6',s:'m6',n:'Minor 6th',f:'1 ♭3 5 6',i:[[0,1],[3,3],[7,5],[9,6]],
 e:['The "m" means minor third (♭3), and the "6" adds a major sixth. It does not contain a seventh.',
    'The traditional tonic chord for minor keys in jazz. The major sixth gives it a distinctive, slightly bright minor sound, heavily associated with Gypsy jazz and standard minor endings.']},
{k:'9',s:'9',n:'Dominant 9th',f:'1 3 5 ♭7 9',i:[[0,1],[4,3],[7,5],[10,7],[14,9]],
 e:['A "9" chord inherently includes the minor seventh (♭7) even though it isn\'t written, plus the major ninth (the 2nd, an octave up). The third is major.',
    'A warmer, richer extension of the dominant 7th. It functions exactly like a V7 chord but adds a thicker texture and smoother voice-leading options.']},
{k:'maj9',s:'maj9',n:'Major 9th',f:'1 3 5 7 9',i:[[0,1],[4,3],[7,5],[11,7],[14,9]],
 e:['"maj9" explicitly includes both the major seventh (7) and the major ninth (9). The third is major.',
    'A lush, modern extension of the major tonic (I). Very common in ballads and bossa nova, providing a fuller, more complex resolution than a basic maj7.']},
{k:'m9',s:'m9',n:'Minor 9th',f:'1 ♭3 5 ♭7 9',i:[[0,1],[3,3],[7,5],[10,7],[14,9]],
 e:['The "m" means minor third (♭3). The "9" implies the minor seventh (♭7) and adds the major ninth (9).',
    'An extension of the m7 chord. Frequently used for the ii chord in major keys, or as a static, groove-oriented vamp chord in modal jazz and funk.']},
{k:'7b9',s:'7♭9',n:'Dominant 7th Flat 9',f:'1 3 5 ♭7 ♭9',i:[[0,1],[4,3],[7,5],[10,7],[13,9]],
 e:['The "7" implies a minor seventh (♭7). The "♭9" means the ninth is lowered by a half-step, sitting a minor ninth above the root.',
    'The quintessential altered dominant chord for resolving to a minor tonic (V of i). The ♭9 creates strong voice-leading tension that pulls naturally down to the fifth of the target chord.']},
{k:'7s9',s:'7♯9',n:'Dominant 7th Sharp 9',f:'1 3 5 ♭7 ♯9',i:[[0,1],[4,3],[7,5],[10,7],[15,9]],
 e:['The "7" implies a minor seventh (♭7). The "♯9" raises the ninth by a half-step, making it sound enharmonically like a minor third clashing against the major third.',
    'Famously known in rock as the "Hendrix chord," in jazz it provides a gritty, bluesy tension that resolves powerfully to both major and minor chords (often derived from the altered scale).']},
{k:'13',s:'13',n:'Dominant 13th',f:'1 3 5 ♭7 13',i:[[0,1],[4,3],[7,5],[10,7],[21,13]],
 e:['A "13" implies the minor seventh (♭7) and adds the major thirteenth (the 6th, an octave up). The 9th is usually played, but the 11th is almost always omitted to avoid clashing with the major third.',
    'The brightest and most extended dominant chord. It resolves very smoothly to a major tonic because the 13th is the exact same note as the major third of the target I chord.']},
{k:'7s5',s:'7♯5',n:'Dominant 7th Sharp 5 (Augmented)',f:'1 3 ♯5 ♭7',i:[[0,1],[4,3],[8,5],[10,7]],
 e:['The "7" implies a minor seventh (♭7). The "♯5" means the fifth is raised a half-step (augmented).',
    'Creates a strong whole-tone scale flavor. It builds an unstable tension that typically resolves to a chord whose root is a perfect fourth higher (like a V7 going to a Imaj7).']},
{k:'7b5',s:'7♭5',n:'Dominant 7th Flat 5',f:'1 3 ♭5 ♭7',i:[[0,1],[4,3],[6,5],[10,7]],
 e:['The "7" implies a minor seventh (♭7). The "♭5" means the fifth is lowered a half-step.',

];

var AS={'-2':'♭♭','-1':'♭','0':'','1':'♯','2':'♯♯'};
var AN={'-2':' double flat','-1':' flat','0':'','1':' sharp','2':' double sharp'};
var S={auto:false,a:20,b:20}, off={};
var last='', cur=null, shown=false;
var paused=false, sheetOpen=false, elapsed=0, lastT=0, raf=0, fbTimer=0;
var chordCount=0;
var wl=null, wlBusy=false;
var $=function(i){return document.getElementById(i)};

// Escalado dinámico del cifrado si no cabe en el móvil
function fitText(){
  var sym = $('sym');
  sym.style.fontSize = ''; 
  var maxW = window.innerWidth - 40; 
  if(sym.scrollWidth > maxW){
    var curSize = parseFloat(window.getComputedStyle(sym).fontSize);
    sym.style.fontSize = (curSize * (maxW / sym.scrollWidth) * 0.95) + 'px';
  }
}
window.addEventListener('resize', fitText);

// Motor de partículas (Fuegos artificiales blancos/dorados)
var fwCvs = $('fw-canvas'), fwCtx = fwCvs.getContext('2d'), fwParts = [];
function resizeFw(){ fwCvs.width = window.innerWidth; fwCvs.height = window.innerHeight; }
window.addEventListener('resize', resizeFw);
resizeFw();
function loopFw(){
  requestAnimationFrame(loopFw);
  if(fwParts.length === 0){ fwCtx.clearRect(0,0,fwCvs.width,fwCvs.height); return; }
  fwCtx.clearRect(0,0,fwCvs.width,fwCvs.height);
  for(var i=fwParts.length-1; i>=0; i--){
    var p = fwParts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.a -= p.d;
    if(p.a <= 0){ fwParts.splice(i,1); continue; }
    fwCtx.globalAlpha = p.a;
    fwCtx.fillStyle = p.c;
    fwCtx.beginPath();
    fwCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    fwCtx.fill();
  }
}
loopFw();
function spawnBurst(x, y, isBig){
  var cols = ['#FFFFFF', '#F4F1EA', '#FFF59D', '#FFD54F', '#FFC107', '#FFE082'];
  var cnt = isBig ? 60 : 30;
  for(var i=0; i<cnt; i++){
    var ang = Math.random()*Math.PI*2;
    var spd = Math.random()*(isBig ? 6 : 4) + 1.5;
    fwParts.push({
      x:x, y:y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      c: cols[Math.floor(Math.random()*cols.length)],
      a: 1, d: 0.01 + Math.random()*0.02,
      r: Math.random()*2 + 1.5
    });
  }
}
function triggerFireworks(){
  var w = fwCvs.width, h = fwCvs.height;
  spawnBurst(w*0.5, h*0.4, true);
  setTimeout(function(){ spawnBurst(w*0.25, h*0.3, false); }, 250);
  setTimeout(function(){ spawnBurst(w*0.75, h*0.35, false); }, 500);
  setTimeout(function(){ spawnBurst(w*0.5, h*0.2, true); }, 800);
}

function load(){
  try{
    var j=JSON.parse(localStorage.getItem('acordes.v3')||'null');
    if(!j)return;
    S.auto=!!j.auto;
    if(j.a>=1&&j.a<=60)S.a=Math.round(j.a);
    if(j.b>=1&&j.b<=60)S.b=Math.round(j.b);
    (j.off||[]).forEach(function(k){off[k]=true});
    if(T.every(function(t){return off[t.k]}))off={};
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem('acordes.v3',JSON.stringify({auto:S.auto,a:S.a,b:S.b,off:Object.keys(off)}));
  }catch(e){}
}

function spell(r,iv){
  var rpc=(N[r[0]]+r[1]+12)%12;
  return iv.map(function(p){
    var li=(r[0]+(p[1]-1))%7, tg=(rpc+p[0])%12, d=(tg-N[li]+12)%12;
    if(d>6)d-=12;
    return {l:li,a:d};
  });
}
function nm(x,words){return L[x.l]+(words?(AN[x.a]||''):(AS[x.a]||''))}

function paintBar(){
  var D=shown?S.b:S.a;
  var f=Math.max(0,1-elapsed/D);
  $('fill').style.transform='scaleX('+f+')';
  $('fill').className=shown?'b':'';
}
function hide(){
  shown=false; elapsed=0;
  $('answer').classList.remove('on');
  $('name').textContent=''; $('notes').textContent=''; $('formula').textContent='';
  $('why').textContent='';
  paintBar();
}
function reveal(){
  shown=true; elapsed=0;
  $('name').textContent=nm(cur.r,true)+' '+cur.t.n;
  $('notes').textContent=cur.notes.map(function(x){return nm(x,false)}).join('  ');
  $('formula').textContent=cur.t.f;
  var w=$('why');
  w.textContent='';
  cur.t.e.forEach(function(line){
    var p=document.createElement('p');
    p.textContent=line;
    w.appendChild(p);
  });
  $('answer').classList.add('on');
  paintBar();
}
function pick(){
  var act=T.filter(function(t){return !off[t.k]});
  var c,tries=0,r,t;
  do{
    r=R[Math.floor(Math.random()*R.length)];
    t=act[Math.floor(Math.random()*act.length)];
    c=r.join(',')+t.k; tries++;
  }while(c===last && tries<20);
  last=c;
  var root={l:r[0],a:r[1]};
  cur={r:root,t:t,notes:spell(r,t.i)};
  $('sym').textContent=nm(root,false)+t.s;
  hide();
  requestAnimationFrame(fitText);
  
  // Lógica del contador y fuegos artificiales
  chordCount++;
  $('counter').textContent = chordCount;
  if(chordCount > 0 && chordCount % 10 === 0) {
    triggerFireworks();
  }
}
function advance(){
  if(shown)pick(); else reveal();
}

function tick(t){
  raf=requestAnimationFrame(tick);
  if(!lastT)lastT=t;
  var dt=Math.min((t-lastT)/1000,0.25);
  lastT=t;
  if(!paused) elapsed+=dt;
  if(elapsed>=(shown?S.b:S.a))advance();
  paintBar();
}
function wake(want){
  try{
    if(!('wakeLock' in navigator))return;
    if(want&&!wl&&!wlBusy){
      wlBusy=true;
      navigator.wakeLock.request('screen').then(function(l){
        wl=l; wlBusy=false;
        l.addEventListener('release',function(){wl=null});
      }).catch(function(){wlBusy=false});
    }else if(!want&&wl){
      wl.release(); wl=null;
    }
  }catch(e){wlBusy=false}
}
function syncTimer(){
  var run=S.auto&&!sheetOpen&&document.visibilityState==='visible';
  if(run){
    if(!raf){lastT=0; raf=requestAnimationFrame(tick)}
  }else if(raf){
    cancelAnimationFrame(raf); raf=0;
  }
  wake(S.auto&&document.visibilityState==='visible');
}
function paintUI(){
  document.body.classList.toggle('auto',S.auto);
  $('autoToggle').setAttribute('aria-pressed',S.auto?'true':'false');
  $('autoToggle').textContent = S.auto ? 'ON' : 'OFF';
  $('icon-pause').hidden = paused;
  $('icon-play').hidden = !paused;
  $('aVal').textContent=S.a+' s';
  $('bVal').textContent=S.b+' s';
}

function openSheet(){
  sheetOpen=true;
  $('sheet').hidden=false;
  syncTimer();
  $('autoToggle').focus({preventScroll:true});
  document.querySelector('.panel').scrollTop=0;
}
function closeSheet(){
  sheetOpen=false;
  $('sheet').hidden=true;
  save();
  syncTimer();
  $('setBtn').focus();
}
function step(key,d){
  S[key]=Math.min(60,Math.max(1,S[key]+d));
  paintUI(); paintBar(); save();
}

T.forEach(function(t){
  var b=document.createElement('button');
  b.type='button'; b.className='chip'; b.textContent=t.s;
  function paint(){b.setAttribute('aria-pressed',off[t.k]?'false':'true')}
  b.onclick=function(){
    var n=T.filter(function(x){return !off[x.k]}).length;
    if(!off[t.k]&&n===1){$('err').textContent='Keep at least one chord type active.';return}
    $('err').textContent='';
    if(off[t.k])delete off[t.k]; else off[t.k]=true;
    paint(); save();
  };
  paint(); $('chips').appendChild(b);
});

$('autoToggle').onclick=function(){
  S.auto=!S.auto; paused=false; elapsed=0;
  paintUI(); paintBar(); save(); syncTimer();
};

$('left-zone').onclick=function(e){
  e.stopPropagation();
  paused=!paused;
  paintUI();
};

$('right-zone').onclick=function(e){
  e.stopPropagation();
  if (paused) {
    paused = false;
    paintUI();
  }
  advance(); // Avanza al siguiente estado (explicación o nuevo acorde) de forma normal
  elapsed=0; 
  paintBar();
};

$('wrap').addEventListener('click',function(){
  if(S.auto) return;
  syncTimer();
  advance();
});

$('setBtn').onclick=openSheet;
$('backdrop').onclick=closeSheet;

$('aMinus').onclick=function(){step('a',-1)};
$('aPlus').onclick=function(){step('a',1)};
$('bMinus').onclick=function(){step('b',-1)};
$('bPlus').onclick=function(){step('b',1)};

document.addEventListener('keydown',function(e){
  if(sheetOpen){
    if(e.key==='Escape')closeSheet();
    return;
  }
  if((e.code==='Space'||e.key==='Enter')&&e.target.tagName!=='BUTTON'){
    e.preventDefault(); 
    advance(); 
    if(S.auto){ elapsed=0; paintBar(); }
  }
});
document.addEventListener('visibilitychange',syncTimer);

load();
paintUI();
pick();
syncTimer();
</script>
</body>
</html>
